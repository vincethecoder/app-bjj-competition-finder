name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

defaults:
  run:
    working-directory: PeteBJJCompFeed

# A warning anywhere in the workspace fails the build. Xcode 26 generates the
# string catalog symbols the SwiftUI feed uses; macos-15 defaults to Xcode 16.4.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  BUILD_FLAGS: CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES

jobs:
  ios:
    name: Test on iOS Simulator
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pick the newest available iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [(runtime, d) for runtime, ds in devices.items() if ".iOS-" in runtime for d in ds if d["name"].startswith("iPhone")]
          version = lambda runtime: [int(p) for p in runtime.split(".iOS-")[1].split("-")]
          runtime, device = max(iphones, key=lambda t: version(t[0]))
          print(device["udid"])
          ')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          echo "DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$udid"

      # Tests run on this one booted simulator rather than on parallel clones.
      # Cold clones on a busy runner made fast tests take 7-15s and timed out
      # URLSessionHTTPClientTests (run 40116604041).
      - name: Boot the simulator
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Unit tests (domain, API, cache)
        run: xcodebuild test -parallel-testing-enabled NO -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeed -destination "$DESTINATION" $BUILD_FLAGS

      - name: UI and presentation tests
        run: xcodebuild test -parallel-testing-enabled NO -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeediOS -destination "$DESTINATION" $BUILD_FLAGS

      - name: Core Data cache integration tests
        run: xcodebuild test -parallel-testing-enabled NO -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeedCacheIntegrationTests -destination "$DESTINATION" $BUILD_FLAGS

      - name: SwiftUI feed tests
        run: xcodebuild test -parallel-testing-enabled NO -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeedSwiftUI -destination "$DESTINATION" $BUILD_FLAGS

      - name: API end-to-end tests
        run: xcodebuild test -parallel-testing-enabled NO -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeedAPIEndToEndTests -destination "$DESTINATION" $BUILD_FLAGS

      - name: Static analysis
        run: |
          xcodebuild analyze -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeediOS -destination "$DESTINATION" $BUILD_FLAGS
          xcodebuild analyze -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeedSwiftUI -destination "$DESTINATION" $BUILD_FLAGS
          xcodebuild analyze -workspace ../PeteBJJCompApp/PeteBJJCompApp.xcworkspace -scheme PeteBJJCompApp -destination "$DESTINATION" $BUILD_FLAGS

      - name: App composition and acceptance tests
        working-directory: PeteBJJCompApp
        run: xcodebuild test -parallel-testing-enabled NO -workspace PeteBJJCompApp.xcworkspace -scheme PeteBJJCompApp -destination "$DESTINATION" $BUILD_FLAGS

  macos:
    name: Test core on macOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Unit tests (domain, API, cache)
        run: xcodebuild test -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeed -destination "platform=macOS" $BUILD_FLAGS

      - name: Core Data cache integration tests
        run: xcodebuild test -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeedCacheIntegrationTests -destination "platform=macOS" $BUILD_FLAGS
