name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

defaults:
  run:
    working-directory: PeteBJJCompFeed

jobs:
  ios:
    name: Test on iOS Simulator
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick the newest available iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [(runtime, d) for runtime, ds in devices.items() if ".iOS-" in runtime for d in ds if d["name"].startswith("iPhone")]
          version = lambda runtime: [int(p) for p in runtime.split(".iOS-")[1].split("-")]
          runtime, device = max(iphones, key=lambda t: version(t[0]))
          print(device["udid"])
          ')
          echo "DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$udid"

      - name: Unit tests (domain, API, cache)
        run: xcodebuild test -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeed -destination "$DESTINATION" CODE_SIGNING_ALLOWED=NO

      - name: UI and presentation tests
        run: xcodebuild test -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeediOS -destination "$DESTINATION" CODE_SIGNING_ALLOWED=NO

      - name: Core Data cache integration tests
        run: xcodebuild test -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeedCacheIntegrationTests -destination "$DESTINATION" CODE_SIGNING_ALLOWED=NO

      - name: API end-to-end tests
        run: xcodebuild test -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeedAPIEndToEndTests -destination "$DESTINATION" CODE_SIGNING_ALLOWED=NO

      - name: Static analysis
        run: xcodebuild analyze -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeediOS -destination "$DESTINATION" CODE_SIGNING_ALLOWED=NO

      - name: Build the app
        working-directory: PeteBJJCompApp
        run: xcodebuild build -workspace PeteBJJCompApp.xcworkspace -scheme PeteBJJCompApp -destination "$DESTINATION" CODE_SIGNING_ALLOWED=NO

  macos:
    name: Test core on macOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit tests (domain, API, cache)
        run: xcodebuild test -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeed -destination "platform=macOS" CODE_SIGNING_ALLOWED=NO

      - name: Core Data cache integration tests
        run: xcodebuild test -project PeteBJJCompFeed.xcodeproj -scheme PeteBJJCompFeedCacheIntegrationTests -destination "platform=macOS" CODE_SIGNING_ALLOWED=NO
